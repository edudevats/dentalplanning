{% extends "layout.html" %}
{% block page_title %}Distribucion de Ingresos{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-wrap gap-3 items-end">
    <div class="w-40">
      <label class="block text-sm font-medium text-text-secondary mb-1 font-body">Mes</label>
      <select id="sel-month" class="block w-full rounded-lg border border-border px-3 py-2.5 text-sm font-body min-h-[44px] bg-surface focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-500"></select>
    </div>
    <div class="w-28">
      <label class="block text-sm font-medium text-text-secondary mb-1 font-body">Anio</label>
      <select id="sel-year" class="block w-full rounded-lg border border-border px-3 py-2.5 text-sm font-body min-h-[44px] bg-surface focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-500"></select>
    </div>
  </div>

  <!-- Ganancia total -->
  <div id="card-ganancia" class="hidden bg-surface rounded-xl border border-border p-5 shadow-sm text-center">
    <p class="text-sm text-text-muted mb-1 font-body">Ganancia Neta a Distribuir</p>
    <p class="text-3xl font-bold tabular-nums text-accent-700 font-heading" id="stat-ganancia">-</p>
  </div>

  <!-- Chart + Table -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div id="chart-card" class="hidden bg-surface rounded-xl border border-border shadow-sm">
      <div class="px-5 py-4 border-b border-border"><h3 class="text-sm font-semibold font-heading text-text-primary">Distribucion Visual</h3></div>
      <div class="p-4" style="height:320px"><canvas id="pie-chart"></canvas></div>
    </div>
    <div class="bg-surface rounded-xl border border-border shadow-sm">
      <div class="px-5 py-4 border-b border-border"><h3 class="text-sm font-semibold font-heading text-text-primary">Detalle por Categoria</h3></div>
      <div id="tbl-dist"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
lucide.createIcons();
const COLORS = ['#0891b2','#059669','#f59e0b','#8b5cf6','#ec4899'];
const CAT_LABELS = { sueldo:'Sueldo', bonos:'Bonos', mcmp:'MCMP', fondo_emergencia:'Fondo Emergencia', marketing:'Marketing' };
const now = new Date();
let selMonth = String(now.getMonth() + 1), selYear = String(now.getFullYear());
let pieChart = null;

populateSelect(document.getElementById('sel-month'), buildMonthOptions(selMonth), selMonth);
buildYearOptions(selYear).forEach(o => document.getElementById('sel-year').appendChild(o));
document.getElementById('sel-month').addEventListener('change', e => { selMonth = e.target.value; loadData(); });
document.getElementById('sel-year').addEventListener('change', e => { selYear = e.target.value; loadData(); });

async function loadData() {
  try {
    const mes = selYear + '-' + String(selMonth).padStart(2, '0');
    const data = await API.get('/reportes/distribucion?mes=' + mes);

    const ganCard = document.getElementById('card-ganancia');
    if (data.ingreso_neto != null) {
      document.getElementById('stat-ganancia').textContent = fmt(data.ingreso_neto);
      ganCard.classList.remove('hidden');
    } else { ganCard.classList.add('hidden'); }

    const dist = data.distribucion || {};
    const pcts = data.porcentajes || {};
    const pctMap = { sueldo: pcts.pct_sueldo, bonos: pcts.pct_bonos, mcmp: pcts.pct_mcmp, fondo_emergencia: pcts.pct_fondo_emergencia, marketing: pcts.pct_marketing };
    const cats = Object.keys(dist).map((k, i) => ({
      name: CAT_LABELS[k] || k,
      value: dist[k] || 0,
      pct: pctMap[k] || 0,
      color: COLORS[i % COLORS.length],
    }));

    const chartCard = document.getElementById('chart-card');
    if (cats.length) {
      chartCard.classList.remove('hidden');
      if (pieChart) pieChart.destroy();
      pieChart = new Chart(document.getElementById('pie-chart'), {
        type: 'doughnut',
        data: {
          labels: cats.map(c => c.name),
          datasets: [{ data: cats.map(c => c.value), backgroundColor: cats.map(c => c.color), borderWidth: 2, borderColor: '#fff' }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { size: 11 }, color: '#475569' } },
            tooltip: { callbacks: { label: ctx => ctx.label + ': ' + fmt(ctx.raw) + ' (' + cats[ctx.dataIndex].pct.toFixed(1) + '%)' } },
          },
          cutout: '55%',
        },
      });
    } else { chartCard.classList.add('hidden'); }

    const cols = [
      { key: 'name', label: 'Categoria', render: (_, row) => {
        const wrap = domEl('div', 'flex items-center gap-2');
        const dot = domEl('span', 'w-3 h-3 rounded-full shrink-0');
        dot.style.backgroundColor = row.color;
        wrap.appendChild(dot);
        wrap.appendChild(domEl('span', '', row.name));
        return wrap;
      }},
      { key: 'pct', label: 'Porcentaje', align: 'right', render: (_, row) => domEl('span', 'tabular-nums font-medium', row.pct.toFixed(1) + '%') },
      { key: 'value', label: 'Monto', align: 'right', render: (_, row) => domEl('span', 'tabular-nums font-medium', fmt(row.value)) },
    ];
    renderTable('tbl-dist', cols, cats, 'Sin datos de distribucion', false);
  } catch { Toast.error('Error al cargar la distribucion'); }
}

loadData();
</script>
{% endblock %}
