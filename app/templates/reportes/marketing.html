{% extends "layout.html" %}
{% block page_title %}Reporte de Marketing{% endblock %}

{% block content %}
<div class="space-y-6">

  <!-- Tab toggle -->
  <div class="flex items-center gap-1 bg-surface-alt rounded-xl p-1 w-fit border border-border shadow-sm">
    <button id="tab-mensual" onclick="switchTab('mensual')"
      class="px-5 py-2 rounded-lg text-sm font-semibold font-body bg-surface shadow-sm text-text-primary border border-border transition-all">
      Mensual
    </button>
    <button id="tab-anual" onclick="switchTab('anual')"
      class="px-5 py-2 rounded-lg text-sm font-semibold font-body text-text-secondary hover:text-text-primary transition-all">
      Anual
    </button>
  </div>

  <!-- ════════════════ PANEL MENSUAL ════════════════ -->
  <div id="panel-mensual" class="space-y-6">
  <div class="flex flex-wrap gap-3 items-end">
    <div class="w-40">
      <label class="block text-sm font-medium text-text-secondary mb-1 font-body">Mes</label>
      <select id="sel-month" class="block w-full rounded-lg border border-border px-3 py-2.5 text-sm font-body min-h-[44px] bg-surface focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-500"></select>
    </div>
    <div class="w-28">
      <label class="block text-sm font-medium text-text-secondary mb-1 font-body">Anio</label>
      <select id="sel-year" class="block w-full rounded-lg border border-border px-3 py-2.5 text-sm font-body min-h-[44px] bg-surface focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-500"></select>
    </div>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
      <div class="flex items-center justify-between">
        <p class="text-sm font-medium text-text-secondary font-body">Estrategias Activas</p>
        <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="megaphone" class="h-4 w-4 text-primary-600"></i></div>
      </div>
      <p class="mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary" id="stat-estrategias">-</p>
    </div>
    <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
      <div class="flex items-center justify-between">
        <p class="text-sm font-medium text-text-secondary font-body">Total Pacientes</p>
        <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="users" class="h-4 w-4 text-primary-600"></i></div>
      </div>
      <p class="mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary" id="stat-pacientes">-</p>
    </div>
    <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
      <div class="flex items-center justify-between">
        <p class="text-sm font-medium text-text-secondary font-body">Ingreso Total</p>
        <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="dollar-sign" class="h-4 w-4 text-primary-600"></i></div>
      </div>
      <p class="mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary" id="stat-monto">-</p>
    </div>
  </div>

  <!-- Content: chart + table or empty state -->
  <div id="content-area"></div>
  </div><!-- /panel-mensual -->

  <!-- ════════════════ PANEL ANUAL ════════════════ -->
  <div id="panel-anual" class="space-y-6 hidden">
    <div class="flex flex-wrap gap-3 items-end">
      <div class="w-28">
        <label class="block text-sm font-medium text-text-secondary mb-1 font-body">Anio</label>
        <select id="a-sel-year" class="block w-full rounded-lg border border-border px-3 py-2.5 text-sm font-body min-h-[44px] bg-surface focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-500"></select>
      </div>
    </div>

    <!-- Stats anuales -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
        <div class="flex items-center justify-between">
          <p class="text-sm font-medium text-text-secondary font-body">Estrategias Activas</p>
          <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="megaphone" class="h-4 w-4 text-primary-600"></i></div>
        </div>
        <p class="mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary" id="a-stat-estrategias">-</p>
      </div>
      <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
        <div class="flex items-center justify-between">
          <p class="text-sm font-medium text-text-secondary font-body">Total Pacientes</p>
          <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="users" class="h-4 w-4 text-primary-600"></i></div>
        </div>
        <p class="mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary" id="a-stat-pacientes">-</p>
      </div>
      <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
        <div class="flex items-center justify-between">
          <p class="text-sm font-medium text-text-secondary font-body">Ingreso Total</p>
          <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="dollar-sign" class="h-4 w-4 text-primary-600"></i></div>
        </div>
        <p class="mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary" id="a-stat-monto">-</p>
      </div>
    </div>

    <div id="a-content-area"></div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
lucide.createIcons();

let anualLoaded = false;
function switchTab(tab) {
  const tabs = ['mensual', 'anual'];
  tabs.forEach(t => {
    const panel = document.getElementById('panel-' + t);
    const btn = document.getElementById('tab-' + t);
    const active = t === tab;
    panel.classList.toggle('hidden', !active);
    btn.className = active
      ? 'px-5 py-2 rounded-lg text-sm font-semibold font-body bg-surface shadow-sm text-text-primary border border-border transition-all'
      : 'px-5 py-2 rounded-lg text-sm font-semibold font-body text-text-secondary hover:text-text-primary transition-all';
  });
  if (tab === 'anual' && !anualLoaded) { anualLoaded = true; loadAnual(); }
}

const now = new Date();
let selMonth = String(now.getMonth() + 1), selYear = String(now.getFullYear());
let barChart = null;

populateSelect(document.getElementById('sel-month'), buildMonthOptions(selMonth), selMonth);
buildYearOptions(selYear).forEach(o => document.getElementById('sel-year').appendChild(o));
document.getElementById('sel-month').addEventListener('change', e => { selMonth = e.target.value; loadData(); });
document.getElementById('sel-year').addEventListener('change', e => { selYear = e.target.value; loadData(); });

async function loadData() {
  try {
    const mes = selYear + '-' + String(selMonth).padStart(2, '0');
    const data = await API.get('/reportes/marketing?mes=' + mes);
    const estrategias = data.por_estrategia || [];
    const totalPacientes = estrategias.reduce((s, e) => s + (e.cantidad || 0), 0);
    const totalMonto = estrategias.reduce((s, e) => s + (e.total || 0), 0);

    document.getElementById('stat-estrategias').textContent = estrategias.length;
    document.getElementById('stat-pacientes').textContent = totalPacientes;
    document.getElementById('stat-monto').textContent = fmt(totalMonto);

    const area = document.getElementById('content-area');

    if (!estrategias.length) {
      area.replaceChildren();
      const card = domEl('div', 'bg-surface rounded-xl border border-border shadow-sm p-10 flex flex-col items-center gap-3 text-center');
      const iconWrap = domEl('div', 'h-12 w-12 rounded-full bg-surface-alt flex items-center justify-center');
      iconWrap.appendChild(domIcon('megaphone', 'h-6 w-6 text-text-muted'));
      card.appendChild(iconWrap);
      card.appendChild(domEl('p', 'text-sm font-semibold text-text-primary font-heading', 'Sin datos de marketing'));
      card.appendChild(domEl('p', 'text-sm text-text-muted font-body max-w-xs', 'Registra ingresos con estrategias de marketing para ver analisis aqui.'));
      area.appendChild(card);
      lucide.createIcons();
      return;
    }

    const chartData = estrategias.slice().sort((a, b) => (b.total || 0) - (a.total || 0));

    // Chart card
    const chartCard = domEl('div', 'bg-surface rounded-xl border border-border shadow-sm mb-6');
    const chartHeader = domEl('div', 'px-5 py-4 border-b border-border');
    chartHeader.appendChild(domEl('h3', 'text-sm font-semibold font-heading text-text-primary', 'Ingresos por Estrategia'));
    const chartBody = domEl('div', 'p-4');
    chartBody.style.height = '288px';
    const canvas = document.createElement('canvas');
    canvas.id = 'bar-mkt';
    chartBody.appendChild(canvas);
    chartCard.appendChild(chartHeader);
    chartCard.appendChild(chartBody);

    // Table card
    const tblCard = domEl('div', 'bg-surface rounded-xl border border-border shadow-sm');
    const tblHeader = domEl('div', 'px-5 py-4 border-b border-border');
    tblHeader.appendChild(domEl('h3', 'text-sm font-semibold font-heading text-text-primary', 'Detalle por Estrategia'));
    const tblBody = domEl('div', '');
    tblBody.id = 'tbl-mkt';
    tblCard.appendChild(tblHeader);
    tblCard.appendChild(tblBody);

    area.replaceChildren(chartCard, tblCard);

    if (barChart) barChart.destroy();
    barChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: chartData.map(e => e.estrategia || 'Sin estrategia'),
        datasets: [{ label: 'Monto', data: chartData.map(e => e.total || 0), backgroundColor: '#0891b2', borderRadius: 4, barThickness: 28 }],
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => fmt(ctx.raw) } } },
        scales: {
          x: { grid: { color: '#e2e8f0' }, ticks: { color: '#94a3b8', font: { size: 11 }, callback: v => '$' + (v/1000).toFixed(0) + 'k' } },
          y: { grid: { display: false }, ticks: { color: '#475569', font: { size: 11 } } },
        },
      },
    });

    const cols = [
      { key: 'estrategia', label: 'Estrategia' },
      { key: 'cantidad', label: 'Pacientes', align: 'center', render: (_, row) => domEl('span', 'tabular-nums font-medium', String(row.cantidad || 0)) },
      { key: 'total', label: 'Monto Total', align: 'right', render: (_, row) => domEl('span', 'tabular-nums font-medium', fmt(row.total)) },
      { key: '_pct', label: '% del Total', align: 'right', render: (_, row) => {
        const p = totalMonto > 0 ? ((row.total || 0) / totalMonto * 100) : 0;
        const badge = domEl('span', 'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-primary-50 text-primary-700', p.toFixed(1) + '%');
        return badge;
      }},
    ];
    renderTable('tbl-mkt', cols, estrategias, 'Sin datos', false);
  } catch { Toast.error('Error al cargar el reporte'); }
}

loadData();

let selYearA = String(now.getFullYear());
let stackChart = null;
const MKT_COLORS = ['#0891b2', '#6366f1', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#64748b'];
const MESES_CORTOS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

buildYearOptions(selYearA).forEach(o => document.getElementById('a-sel-year').appendChild(o));
document.getElementById('a-sel-year').addEventListener('change', e => { selYearA = e.target.value; loadAnual(); });

async function loadAnual() {
  try {
    const data = await API.get('/reportes/marketing/anual?year=' + selYearA);
    const estrategias = data.estrategias || [];
    const totales = data.totales || [];
    const meses = data.meses || [];

    const totalPacientes = totales.reduce((s, t) => s + (t.cantidad || 0), 0);
    const totalMonto = totales.reduce((s, t) => s + (t.total || 0), 0);
    document.getElementById('a-stat-estrategias').textContent = estrategias.length;
    document.getElementById('a-stat-pacientes').textContent = totalPacientes;
    document.getElementById('a-stat-monto').textContent = fmt(totalMonto);

    const area = document.getElementById('a-content-area');

    if (!totales.length) {
      area.replaceChildren();
      const card = domEl('div', 'bg-surface rounded-xl border border-border shadow-sm p-10 flex flex-col items-center gap-3 text-center');
      const iconWrap = domEl('div', 'h-12 w-12 rounded-full bg-surface-alt flex items-center justify-center');
      iconWrap.appendChild(domIcon('megaphone', 'h-6 w-6 text-text-muted'));
      card.appendChild(iconWrap);
      card.appendChild(domEl('p', 'text-sm font-semibold text-text-primary font-heading', 'Sin datos de marketing'));
      card.appendChild(domEl('p', 'text-sm text-text-muted font-body max-w-xs', 'Registra ingresos con estrategias de marketing durante el anio para ver analisis aqui.'));
      area.appendChild(card);
      lucide.createIcons();
      return;
    }

    // Chart card (barras apiladas: X = meses, un dataset por estrategia)
    const chartCard = domEl('div', 'bg-surface rounded-xl border border-border shadow-sm mb-6');
    const chartHeader = domEl('div', 'px-5 py-4 border-b border-border');
    chartHeader.appendChild(domEl('h3', 'text-sm font-semibold font-heading text-text-primary', 'Tendencia mensual por estrategia'));
    const chartBody = domEl('div', 'p-4');
    chartBody.style.height = '320px';
    const canvas = document.createElement('canvas');
    canvas.id = 'stack-mkt';
    chartBody.appendChild(canvas);
    chartCard.appendChild(chartHeader);
    chartCard.appendChild(chartBody);

    // Table card
    const tblCard = domEl('div', 'bg-surface rounded-xl border border-border shadow-sm');
    const tblHeader = domEl('div', 'px-5 py-4 border-b border-border');
    tblHeader.appendChild(domEl('h3', 'text-sm font-semibold font-heading text-text-primary', 'Totales anuales por estrategia'));
    const tblBody = domEl('div', '');
    tblBody.id = 'a-tbl-mkt';
    tblCard.appendChild(tblHeader);
    tblCard.appendChild(tblBody);

    area.replaceChildren(chartCard, tblCard);

    const datasets = estrategias.map((nombre, idx) => ({
      label: nombre,
      data: meses.map(m => m.por_estrategia[nombre] || 0),
      backgroundColor: MKT_COLORS[idx % MKT_COLORS.length],
      borderRadius: 3,
      stack: 'mkt',
    }));

    if (stackChart) stackChart.destroy();
    stackChart = new Chart(canvas, {
      type: 'bar',
      data: { labels: MESES_CORTOS, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 }, color: '#475569' } },
          tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmt(ctx.raw) } },
        },
        scales: {
          x: { stacked: true, grid: { display: false }, ticks: { color: '#475569', font: { size: 11 } } },
          y: { stacked: true, grid: { color: '#e2e8f0' }, ticks: { color: '#94a3b8', font: { size: 11 }, callback: v => '$' + (v/1000).toFixed(0) + 'k' } },
        },
      },
    });

    const cols = [
      { key: 'estrategia', label: 'Estrategia' },
      { key: 'cantidad', label: 'Pacientes', align: 'center', render: (_, row) => domEl('span', 'tabular-nums font-medium', String(row.cantidad || 0)) },
      { key: 'total', label: 'Monto Total', align: 'right', render: (_, row) => domEl('span', 'tabular-nums font-medium', fmt(row.total)) },
      { key: '_pct', label: '% del Total', align: 'right', render: (_, row) => {
        const p = totalMonto > 0 ? ((row.total || 0) / totalMonto * 100) : 0;
        return domEl('span', 'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-primary-50 text-primary-700', p.toFixed(1) + '%');
      }},
    ];
    renderTable('a-tbl-mkt', cols, totales, 'Sin datos', false);
  } catch { Toast.error('Error al cargar el reporte anual'); }
}
</script>
{% endblock %}
