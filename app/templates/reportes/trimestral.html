{% extends "layout.html" %}
{% block page_title %}Reporte Trimestral{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-wrap gap-3 items-end">
    <div class="w-44">
      <label class="block text-sm font-medium text-text-secondary mb-1 font-body">Trimestre</label>
      <select id="sel-quarter" class="block w-full rounded-lg border border-border px-3 py-2.5 text-sm font-body min-h-[44px] bg-surface focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-500"></select>
    </div>
    <div class="w-28">
      <label class="block text-sm font-medium text-text-secondary mb-1 font-body">Anio</label>
      <select id="sel-year" class="block w-full rounded-lg border border-border px-3 py-2.5 text-sm font-body min-h-[44px] bg-surface focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-500"></select>
    </div>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
      <div class="flex items-center justify-between"><p class="text-sm font-medium text-text-secondary font-body">Promedio Mensual Ingresos</p>
        <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="dollar-sign" class="h-4 w-4 text-primary-600"></i></div></div>
      <p class="mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary" id="stat-ing">-</p>
    </div>
    <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
      <div class="flex items-center justify-between"><p class="text-sm font-medium text-text-secondary font-body">Promedio Mensual Gastos</p>
        <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="trending-down" class="h-4 w-4 text-primary-600"></i></div></div>
      <p class="mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary" id="stat-gas">-</p>
    </div>
    <div class="bg-surface rounded-xl border border-border p-5 shadow-sm">
      <div class="flex items-center justify-between"><p class="text-sm font-medium text-text-secondary font-body">Crecimiento</p>
        <div class="h-9 w-9 rounded-lg bg-primary-50 flex items-center justify-center"><i data-lucide="trending-up" class="h-4 w-4 text-primary-600"></i></div></div>
      <p class="mt-3 text-2xl font-bold font-heading tabular-nums" id="stat-crec">-</p>
    </div>
  </div>

  <!-- Chart -->
  <div id="chart-card" class="hidden bg-surface rounded-xl border border-border shadow-sm">
    <div class="px-5 py-4 border-b border-border"><h3 class="text-sm font-semibold font-heading text-text-primary">Comparativa Trimestral</h3></div>
    <div class="p-4" style="height:320px"><canvas id="bar-chart"></canvas></div>
  </div>

  <!-- Table -->
  <div class="bg-surface rounded-xl border border-border shadow-sm">
    <div class="px-5 py-4 border-b border-border"><h3 class="text-sm font-semibold font-heading text-text-primary">Desglose Mensual</h3></div>
    <div id="tbl-meses"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
lucide.createIcons();
const MONTH_NAMES = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const now = new Date();
let selQuarter = String(Math.ceil((now.getMonth() + 1) / 3));
let selYear = String(now.getFullYear());
let barChart = null;

const quarters = [
  { value: '1', label: 'Q1 (Ene-Mar)' },
  { value: '2', label: 'Q2 (Abr-Jun)' },
  { value: '3', label: 'Q3 (Jul-Sep)' },
  { value: '4', label: 'Q4 (Oct-Dic)' },
];
populateSelect(document.getElementById('sel-quarter'), quarters, selQuarter);
buildYearOptions(selYear).forEach(o => document.getElementById('sel-year').appendChild(o));
document.getElementById('sel-quarter').addEventListener('change', e => { selQuarter = e.target.value; loadData(); });
document.getElementById('sel-year').addEventListener('change', e => { selYear = e.target.value; loadData(); });

async function loadData() {
  try {
    const data = await API.get('/reportes/trimestral?year=' + selYear);
    const q = parseInt(selQuarter);
    const qStart = (q - 1) * 3 + 1;
    const allMeses = data.meses || [];
    const filtered = allMeses.filter(m => m.mes >= qStart && m.mes < qStart + 3);

    // Promedio del trimestre from trimestres array
    const trimInfo = (data.trimestres || [])[q - 1] || {};
    document.getElementById('stat-ing').textContent = fmt(trimInfo.promedio || 0);
    document.getElementById('stat-gas').textContent = fmt(trimInfo.promedio_gastos || 0);

    // Crecimiento: compare first vs last month in quarter
    const crecEl = document.getElementById('stat-crec');
    const firstVal = filtered[0]?.total || 0;
    const lastVal = filtered[filtered.length - 1]?.total || 0;
    if (firstVal > 0 && filtered.length > 1) {
      const pct = (lastVal - firstVal) / firstVal * 100;
      crecEl.textContent = pct.toFixed(1) + '%';
      crecEl.className = 'mt-3 text-2xl font-bold font-heading tabular-nums ' + (pct >= 0 ? 'text-accent-700' : 'text-danger-600');
    } else {
      crecEl.textContent = '-';
      crecEl.className = 'mt-3 text-2xl font-bold font-heading tabular-nums text-text-primary';
    }

    const chartCard = document.getElementById('chart-card');
    if (filtered.length) {
      chartCard.classList.remove('hidden');
      if (barChart) barChart.destroy();
      barChart = new Chart(document.getElementById('bar-chart'), {
        type: 'bar',
        data: {
          labels: filtered.map(m => MONTH_NAMES[m.mes] || ('Mes ' + m.mes)),
          datasets: [
            { label: 'Ingresos', data: filtered.map(m => m.total || 0), backgroundColor: '#0891b2', borderRadius: 4 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => fmt(ctx.raw) } } },
          scales: {
            x: { grid: { color: '#e2e8f0' }, ticks: { color: '#94a3b8', font: { size: 11 } } },
            y: { grid: { color: '#e2e8f0' }, border: { display: false }, ticks: { color: '#94a3b8', font: { size: 11 }, callback: v => '$' + (v/1000).toFixed(0) + 'k' } },
          },
        },
      });
    } else { chartCard.classList.add('hidden'); }

    const cols = [
      { key: 'mes', label: 'Mes', render: v => MONTH_NAMES[v] || ('Mes ' + v) },
      { key: 'total', label: 'Ingresos', align: 'right', render: v => domEl('span', 'tabular-nums', fmt(v)) },
      { key: 'gastos', label: 'Gastos', align: 'right', render: v => domEl('span', 'tabular-nums', fmt(v)) },
    ];
    renderTable('tbl-meses', cols, filtered, 'Sin datos para este trimestre', false);
  } catch { Toast.error('Error al cargar el reporte'); }
}

loadData();
</script>
{% endblock %}
