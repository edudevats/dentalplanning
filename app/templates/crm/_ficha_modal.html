<div id="modal-ficha" class="hidden fixed inset-0 z-50 overflow-y-auto">
  <div class="flex min-h-full items-end sm:items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/40" onclick="Modal.close('modal-ficha')"></div>
    <div class="relative bg-surface rounded-2xl shadow-xl w-full max-w-6xl max-h-[85vh] md:h-[85vh] flex flex-col">
      <!-- Encabezado: siempre visible -->
      <div class="flex items-start justify-between gap-3 px-6 py-4 border-b border-border">
        <div class="min-w-0 flex flex-wrap items-center gap-x-2 gap-y-1">
          <h2 id="ficha-titulo" class="text-base font-semibold font-heading text-text-primary">Paciente</h2>
          <span id="ficha-encabezado-expediente"
                class="inline-flex items-center rounded-full bg-primary-50 text-primary-700 px-2.5 py-0.5 text-xs font-semibold font-body whitespace-nowrap">Sin expediente</span>
          <span id="ficha-encabezado-estatus"
                class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium font-body whitespace-nowrap"></span>
          <span id="ficha-encabezado-contacto" class="text-xs text-text-muted font-body"></span>
        </div>
        <button type="button" onclick="Modal.close('modal-ficha')" aria-label="Cerrar"
                class="p-2 rounded-lg text-text-muted hover:bg-surface-hover cursor-pointer shrink-0">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>

      <!-- Pestañas -->
      <div id="ficha-tabs" class="flex gap-1 px-6 border-b border-border" role="tablist">
        <button type="button" id="ficha-tab-datos" role="tab" onclick="Ficha.mostrarTab('datos')"
                class="px-3 py-2.5 -mb-px border-b-2 border-transparent text-sm font-medium font-body text-text-muted hover:text-text-primary cursor-pointer transition-colors duration-200">Datos</button>
        <button type="button" id="ficha-tab-actividad" role="tab" onclick="Ficha.mostrarTab('actividad')"
                class="px-3 py-2.5 -mb-px border-b-2 border-transparent text-sm font-medium font-body text-text-muted hover:text-text-primary cursor-pointer transition-colors duration-200">Actividad</button>
      </div>

      <!-- Pestaña Datos: el formulario del paciente -->
      <div id="fp-panel-datos" role="tabpanel" class="flex-1 min-h-0 overflow-y-auto px-6 py-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3">
          <div class="space-y-3">
            <div><label class="block text-sm font-medium text-text-secondary mb-1 font-body">Nombre *</label>
              <input id="fp-nombre" type="text" class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface min-h-[40px]" /></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="block text-sm font-medium text-text-secondary mb-1 font-body">Teléfono</label>
                <input id="fp-telefono" type="text" class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface min-h-[40px]" /></div>
              <div><label class="block text-sm font-medium text-text-secondary mb-1 font-body">WhatsApp</label>
                <input id="fp-whatsapp" type="text" class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface min-h-[40px]" /></div>
            </div>
            <div><label class="block text-sm font-medium text-text-secondary mb-1 font-body">Email</label>
              <input id="fp-email" type="email" class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface min-h-[40px]" /></div>
            <div><label class="block text-sm font-medium text-text-secondary mb-1 font-body">Fecha de nacimiento <span id="fp-edad" class="text-text-muted font-normal"></span></label>
              <input id="fp-nacimiento" type="date" class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface min-h-[40px]" /></div>
          </div>
          <div class="space-y-3">
            <!-- ficha.js pinta aquí el campo "No. de expediente" -->
            <div id="fp-expediente-slot"></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="block text-sm font-medium text-text-secondary mb-1 font-body">Estatus</label>
                <select id="fp-estatus" class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface min-h-[40px]">
                  <option value="prospecto">Prospecto</option>
                  <option value="activo">Activo</option>
                  <option value="alta">Alta</option>
                  <option value="baja">Baja</option>
                </select></div>
              <div><label class="block text-sm font-medium text-text-secondary mb-1 font-body">Doctor</label>
                <select id="fp-doctor" class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface min-h-[40px]">
                  <option value="">Sin asignar</option>
                </select></div>
            </div>
            <label class="inline-flex items-center gap-2 text-sm font-body text-text-secondary cursor-pointer">
              <input id="fp-problematico" type="checkbox" class="rounded border-border" />
              Paciente problemático (excluir de envíos futuros)
            </label>
            <div><label class="block text-sm font-medium text-text-secondary mb-1 font-body">Notas generales</label>
              <textarea id="fp-notas" rows="3" class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface"></textarea></div>
          </div>
        </div>
        <div class="flex gap-2 pt-4 md:justify-end">
          <button type="button" onclick="Ficha.guardar()"
                  class="flex-1 md:flex-none md:min-w-[160px] rounded-lg bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 text-sm font-medium cursor-pointer transition-colors duration-200">Guardar</button>
          <button type="button" id="fp-btn-eliminar" onclick="Ficha.eliminar()"
                  class="rounded-lg border border-danger-100 text-danger-600 hover:bg-danger-50 px-3 py-2 text-sm cursor-pointer transition-colors duration-200">Eliminar</button>
        </div>
      </div>

      <!-- Pestaña Actividad: lista filtrable a la izquierda, detalle a la derecha.
           Debajo de md se ve una sola columna a la vez (lista o detalle). -->
      <div id="fp-panel-actividad" role="tabpanel" style="display:none"
           class="flex-1 min-h-0 overflow-y-auto md:overflow-hidden md:grid md:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)] md:grid-rows-[minmax(0,1fr)] md:gap-5 px-6 py-5">
        <div id="fp-col-lista" class="md:block md:min-h-0 md:overflow-y-auto md:pr-1 space-y-3">
          <div class="flex flex-wrap gap-2">
            <button type="button" id="fp-btn-visita" onclick="Ficha.registrarVisita()"
                    class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-border hover:bg-surface-hover px-3 py-2 text-xs font-medium cursor-pointer transition-colors duration-200">
              <i data-lucide="calendar-check" class="h-3.5 w-3.5"></i> Visita</button>
            <button type="button" id="fp-btn-seguimiento" onclick="Ficha.programarSeguimiento()"
                    class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-border hover:bg-surface-hover px-3 py-2 text-xs font-medium cursor-pointer transition-colors duration-200">
              <i data-lucide="phone" class="h-3.5 w-3.5"></i> Seguimiento</button>
            <button type="button" id="fp-btn-nota" onclick="Ficha.agregarNota()"
                    class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-border hover:bg-surface-hover px-3 py-2 text-xs font-medium cursor-pointer transition-colors duration-200">
              <i data-lucide="sticky-note" class="h-3.5 w-3.5"></i> Nota</button>
            <button type="button" id="fp-btn-odontograma" onclick="Ficha.abrirOdontograma()"
                    class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-border hover:bg-surface-hover px-3 py-2 text-xs font-medium cursor-pointer transition-colors duration-200">
              <i data-lucide="smile" class="h-3.5 w-3.5"></i> Odontograma</button>
          </div>
          <!-- Formulario inline de acción (visita / seguimiento / nota) -->
          <div id="fp-accion" class="hidden"></div>
          <div id="fp-filtros" class="space-y-2"></div>
          <div id="fp-timeline" class="space-y-2"></div>
        </div>
        <div id="fp-col-detalle" class="hidden md:block md:min-h-0 md:overflow-y-auto">
          <button type="button" id="fp-volver" onclick="FichaActividad.volver()"
                  class="md:hidden mb-3 inline-flex items-center gap-1 text-sm font-medium font-body text-primary-600 hover:underline cursor-pointer">← Volver a la lista</button>
          <div id="fp-detalle"
               class="rounded-xl border border-border bg-surface-alt p-4 text-sm font-body text-text-secondary"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Primera configuración de la numeración de expedientes (solo admin) -->
<div id="modal-config-expediente" class="hidden fixed inset-0 z-[60] overflow-y-auto">
  <div class="flex min-h-full items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/40"></div>
    <div class="relative bg-surface rounded-2xl shadow-xl w-full max-w-md p-6" role="dialog" aria-modal="true"
         aria-labelledby="cfg-exp-titulo">
      <h3 id="cfg-exp-titulo" class="text-base font-semibold font-heading text-text-primary">¿Cómo numeran sus expedientes?</h3>
      <p class="mt-1 text-sm font-body text-text-secondary">Elige el formato una sola vez. Después podrás agregar letras; el formato ya no cambia una vez que haya expedientes.</p>
      <div class="mt-4 space-y-2">
        <label class="flex items-start gap-3 rounded-lg border border-border p-3 cursor-pointer hover:bg-surface-hover">
          <input type="radio" name="cfg-exp-formato" value="letra" class="mt-1" onchange="Ficha.cambiarFormatoConfig()" />
          <span class="text-sm font-body text-text-primary"><span class="font-medium">Letra + 6 números</span>
            <span class="block text-xs text-text-muted">Ejemplo: A000245</span></span>
        </label>
        <div id="cfg-exp-letras-caja" class="hidden pl-8">
          <label for="cfg-exp-letras" class="block text-xs font-medium text-text-secondary mb-1 font-body">Letras que usan (ej. A, B)</label>
          <input id="cfg-exp-letras" type="text" maxlength="80" placeholder="A"
                 class="block w-full rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface min-h-[40px] uppercase" />
        </div>
        <label class="flex items-start gap-3 rounded-lg border border-border p-3 cursor-pointer hover:bg-surface-hover">
          <input type="radio" name="cfg-exp-formato" value="numerico" class="mt-1" onchange="Ficha.cambiarFormatoConfig()" />
          <span class="text-sm font-body text-text-primary"><span class="font-medium">7 números</span>
            <span class="block text-xs text-text-muted">Ejemplo: 0000245</span></span>
        </label>
      </div>
      <div class="mt-5 flex justify-end gap-2">
        <button type="button" onclick="Modal.close('modal-config-expediente')"
                class="rounded-lg border border-border hover:bg-surface-hover px-4 py-2 text-sm font-medium cursor-pointer transition-colors duration-200">Ahora no</button>
        <button type="button" onclick="Ficha.guardarConfigExpediente()"
                class="rounded-lg bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 text-sm font-medium cursor-pointer transition-colors duration-200">Guardar</button>
      </div>
    </div>
  </div>
</div>
