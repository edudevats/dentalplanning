{% extends "crm/_layout.html" %}
{% block title %}Tablero — CRM de Pacientes{% endblock %}
{% block cs_content %}
<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <h1 class="text-2xl font-bold font-heading text-text-primary">Tablero de Pacientes</h1>
    <div class="flex items-center gap-3 flex-wrap">
      <input id="kb-buscar" type="text" placeholder="Buscar nombre o teléfono…"
             class="rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface focus:ring-2 focus:ring-primary-300 focus:border-primary-500 outline-none min-h-[38px] w-56" />
      <select id="kb-doctor"
              class="rounded-lg border border-border px-3 py-2 text-sm font-body bg-surface outline-none min-h-[38px] w-44">
        <option value="">Todos los doctores</option>
      </select>
      <label class="inline-flex items-center gap-2 text-sm font-body text-text-secondary cursor-pointer">
        <input id="kb-solo-inactivos" type="checkbox" class="rounded border-border" />
        Solo inactivos
      </label>
      <button type="button" onclick="Kanban.nuevoPaciente()"
              class="inline-flex items-center justify-center gap-2 rounded-lg font-medium font-body cursor-pointer bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 text-sm min-h-[38px]">
        <i data-lucide="plus" class="h-4 w-4"></i> Nuevo paciente
      </button>
    </div>
  </div>

  <div id="kb-resumen" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>

  <div id="kb-tablero" class="flex gap-4 overflow-x-auto pb-4 items-start"></div>
</div>

{% include "crm/_ficha_modal.html" ignore missing %}
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/crm/kanban.js') }}"></script>
<script src="{{ url_for('static', filename='js/crm/ficha.js') }}"></script>
{% endblock %}
